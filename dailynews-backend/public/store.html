<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily News 商城</title>

    <style>
        body {
            margin: 0;
            background: #061426;
            color: #ffffff;
            font-family: Arial, "Microsoft YaHei", sans-serif;
        }

        .store-header {
            padding: 22px 30px;
            border-bottom: 2px solid #e8bd24;
            background: #07111f;
        }

        .store-header-inner,
        .store-main {
            width: min(1180px, calc(100% - 30px));
            margin: 0 auto;
        }

        .store-header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .store-header h1 {
            margin: 0;
            color: #ffd447;
            font-size: 30px;
        }

        .store-header a {
            color: #ffffff;
            text-decoration: none;
        }

        .store-main {
            margin-top: 30px;
            margin-bottom: 40px;
        }

        .store-hero {
            padding: 32px;
            border: 1px solid #1d628f;
            border-radius: 16px;
            background: linear-gradient(135deg, #07346f, #061a34);
        }

        .store-hero h2 {
            margin: 0 0 12px;
            color: #ffd447;
            font-size: 34px;
        }

        .store-hero p {
            max-width: 760px;
            margin: 0;
            color: #cfe7f7;
            line-height: 1.8;
        }

        .store-category-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 24px 0;
        }

        .store-category-nav button {
            padding: 10px 18px;
            border: 1px solid #168fd8;
            border-radius: 999px;
            background: #0a3155;
            color: #ffffff;
            cursor: pointer;
        }

        .store-category-nav button.active {
            background: #0aa9ed;
        }

        .store-status {
            min-height: 22px;
            margin-bottom: 16px;
            color: #9dc6df;
        }

        .store-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .store-card {
            overflow: hidden;
            border: 1px solid #1c5f8a;
            border-radius: 14px;
            background: #0a2441;
        }

        .store-card-cover {
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0c5d9c, #08182c);
            color: #ffd447;
            font-size: 24px;
            font-weight: 800;
        }

        .store-card-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .store-card-body {
            padding: 18px;
        }

        .store-card h3 {
            margin: 0 0 10px;
            font-size: 20px;
        }

        .store-card p {
            min-height: 68px;
            margin: 0;
            color: #b9d1e2;
            line-height: 1.6;
        }

        .store-price-row {
            margin-top: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .store-price {
            color: #ffd447;
            font-size: 22px;
            font-weight: 800;
        }

        .store-buy-button {
            padding: 10px 16px;
            border: 0;
            border-radius: 7px;
            background: #0aa9ed;
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }

        .store-empty {
            grid-column: 1 / -1;
            padding: 30px;
            border: 1px dashed #2b7da9;
            border-radius: 10px;
            color: #9dc6df;
            text-align: center;
        }
    </style>
</head>

<body>
    <header class="store-header">
        <div class="store-header-inner">
            <h1>Daily News 商城</h1>
            <a href="/">返回新闻首页</a>
        </div>
    </header>

    <main class="store-main">
        <section class="store-hero">
            <h2>数字内容与会员商城</h2>
            <p>
                提供电子书、研究报告、视频内容、VIP会员和企业订阅服务。
                商品由后台统一管理，新增或上下架后前台自动同步。
            </p>
        </section>

        <div class="store-category-nav">
            <button type="button" class="active" data-store-type="all">
                全部商品
            </button>
            <button type="button" data-store-type="ebook">电子书</button>
            <button type="button" data-store-type="report">研究报告</button>
            <button type="button" data-store-type="video">视频内容</button>
            <button type="button" data-store-type="membership">会员服务</button>
        </div>

        <p id="storeStatus" class="store-status">正在读取商品...</p>
        <section id="storeGrid" class="store-grid"></section>
    </main>

    <script src="/store.js"></script>
</body>

</html>
