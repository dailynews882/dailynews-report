<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新闻详情 - Daily News</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #06111f;
            color: #ffffff;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 36px;
            background: #0d1c31;
            border-bottom: 1px solid rgba(80, 150, 255, 0.35);
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .back-btn {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 8px;
            background: #147ef5;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
        }

        .page {
            max-width: 980px;
            margin: 36px auto;
            padding: 0 20px 60px;
        }

        .message {
            padding: 16px 20px;
            border-radius: 10px;
            background: rgba(20, 126, 245, 0.14);
            border: 1px solid rgba(20, 126, 245, 0.35);
            color: #9fcaff;
            margin-bottom: 20px;
        }

        .article {
            background: #0d1c31;
            border: 1px solid rgba(80, 150, 255, 0.35);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
        }

        .tag-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .category {
            color: #79b8ff;
            font-weight: bold;
        }

        .vip-tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            background: linear-gradient(90deg, #f5c542, #ff8a00);
            color: #111827;
            font-weight: bold;
            font-size: 13px;
        }

        h1 {
            margin: 0 0 16px;
            font-size: 34px;
            line-height: 1.35;
        }

        .meta {
            color: #9fcaff;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 22px;
        }

        .cover {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            border-radius: 14px;
            margin: 16px 0 24px;
            background: #10233d;
        }

        .summary {
            padding: 18px 20px;
            background: rgba(20, 126, 245, 0.1);
            border-left: 4px solid #147ef5;
            border-radius: 10px;
            color: #d6e9ff;
            line-height: 1.8;
            margin-bottom: 24px;
        }

        .content {
            color: #f5f7fb;
            line-height: 2;
            font-size: 17px;
            white-space: normal;
            overflow-wrap: anywhere;
        }

        .content p {
            margin: 0 0 18px;
        }

        .content img {
            display: block;
            width: auto;
            max-width: 100%;
            height: auto;
            margin: 18px auto;
            border-radius: 12px;
            object-fit: contain;
        }

        .content video {
            display: block;
            width: 100%;
            max-height: 680px;
            margin: 18px auto;
            border-radius: 12px;
            background: #000000;
        }

        .content a {
            color: #43c8ff;
            text-decoration: underline;
        }

        .lock-box {
            background: #0d1c31;
            border: 1px solid rgba(245, 197, 66, 0.55);
            border-radius: 16px;
            padding: 28px;
            text-align: center;
        }

        .lock-title {
            font-size: 26px;
            font-weight: bold;
            color: #ffd54f;
            margin-bottom: 12px;
        }

        .lock-text {
            color: #d6e9ff;
            line-height: 1.8;
            margin-bottom: 24px;
        }

        .action-row {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .primary-btn,
        .secondary-btn {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 8px;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .primary-btn {
            background: #147ef5;
        }

        .secondary-btn {
            background: #7c4dce;
        }

        @media (max-width: 700px) {
            .top-bar {
                padding: 16px 18px;
            }

            .logo {
                font-size: 21px;
            }

            .article {
                padding: 20px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
    <link rel="stylesheet" href="/style.css?v=23">

</head>

<body>
    <header class="top-bar">
        <div class="logo">Daily News 新闻详情</div>
        <a class="back-btn" href="/index.html">返回首页</a>
    </header>

    <main class="page">
        <div id="messageBox" class="message">正在加载新闻详情...</div>
        <div id="articleBox"></div>
        <section class="comments-section">
            <div class="comments-header">
                <h2>评论区</h2> <span> 共 <strong id="commentCount">0</strong> 条评论 </span>
            </div>
            <form id="commentForm" class="comment-form"> <textarea id="commentInput" class="comment-input" rows="4"
                    maxlength="300" placeholder="写下你的看法，最多 300 个字..."></textarea>
                <div class="comment-form-footer">
                    <p id="commentMessage" class="comment-message">
                        正在加载评论...
                    </p>

                    <button type="submit" class="comment-submit-btn">
                        发布评论
                    </button>
                </div>
            </form>
            <div id="commentList" class="comment-list"></div>
        </section>
    </main>

    <script src="/news-detail.js"></script>
    <script src="/news-comments.js?v=26"></script>
</body>

</html>
