<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DailyNews 后台 - 编辑新闻</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px;
      background: #0f172a;
      color: #e5e7eb;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #111827;
      padding: 25px;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      color: #38bdf8;
      font-size: 34px;
    }

    .btn {
      padding: 9px 15px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      display: inline-block;
    }

    .btn-back {
      background: #475569;
    }

    .btn-back:hover {
      background: #334155;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: bold;
      color: #cbd5e1;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #020617;
      color: #e5e7eb;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .content-box {
      min-height: 260px;
    }

    .row {
      display: flex;
      gap: 15px;
    }

    .row>div {
      flex: 1;
    }

    .vip-line {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .vip-line input {
      width: auto;
    }

    button[type="submit"] {
      margin-top: 24px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #16a34a;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button[type="submit"]:hover {
      background: #15803d;
    }

    #newsMessage {
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 8px;
      background: #020617;
      color: #facc15;
      min-height: 20px;
    }

    .news-edit-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .news-edit-actions button {
      margin-top: 0;
    }

    .publish-news-button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #16b96b;
      color: #ffffff;
      font-size: 16px;
      cursor: pointer;
    }

    .publish-news-button:hover {
      background: #10985a;
    }

    .publish-news-button:disabled {
      cursor: not-allowed;
      background: #526274;
      opacity: 0.75;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="top-bar">
      <h1>编辑新闻</h1>
      <a class="btn btn-back" href="./news-list.html">返回新闻列表</a>
    </div>

    <div id="newsMessage">正在读取新闻内容...</div>

    <form id="newsEditForm">
      <label for="newsTitle">新闻标题 *</label>
      <input id="newsTitle" type="text" required />

      <div class="row">
        <div>
          <label for="newsCategory">新闻分类</label>
          <select id="newsCategory">
            <option value="general">综合新闻</option>
            <option value="world">国际新闻</option>
            <option value="finance">财经新闻</option>
            <option value="technology">科技新闻</option>
            <option value="ai">AI 新闻</option>
            <option value="singapore">新加坡新闻</option>
            <option value="china">中国新闻</option>
            <option value="usa">美国新闻</option>
          </select>
        </div>

        <div>
          <label for="newsStatus">发布状态</label>
          <select id="newsStatus">
            <option value="pending">待审核</option>
            <option value="draft">草稿</option>
            <option value="published">已发布</option>
          </select>
        </div>
      </div>

      <label for="newsSummary">新闻摘要</label>
      <textarea id="newsSummary"></textarea>

      <label for="newsContent">新闻正文 *</label>
      <textarea id="newsContent" class="content-box" required></textarea>

      <label for="newsImageUrl">封面图片链接</label>
      <input id="newsImageUrl" type="text" />

      <label for="newsVideoUrl">视频链接</label>
      <input id="newsVideoUrl" type="text" />

      <label for="newsSource">新闻来源</label>
      <input id="newsSource" type="text" />

      <label for="newsAuthor">作者</label>
      <input id="newsAuthor" type="text" />

      <div class="vip-line">
        <input id="newsIsVip" type="checkbox" />
        <span>设置为 VIP 新闻</span>
      </div>

      <div class="news-edit-actions">
        <button type="submit" id="saveNewsButton">
          保存修改
        </button>

        <button type="button" id="publishNewsButton" class="publish-news-button">
          发布新闻
        </button>
      </div>
    </form>
  </div>

  <script src="./news-edit.js"></script>
</body>

</html>
