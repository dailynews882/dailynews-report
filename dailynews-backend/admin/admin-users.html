<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户管理 - Daily News</title>
  <link rel="stylesheet" href="admin.css" />
</head>

<body>

  <div class="admin-layout">

    <aside class="admin-sidebar" id="adminSidebar"></aside>

    <main class="admin-main">
      <header class="admin-header">
        <h1>用户管理</h1>
        <span>管理网站注册用户</span>
      </header>

      <section class="admin-panel">
        <div class="panel-title-row">
          <h2>用户列表</h2>
          <button class="small-btn" disabled title="只读阶段暂不开放创建用户">添加用户（待开放）</button>
        </div>

        <div class="table-tools">
          <input type="text" id="userSearchInput" placeholder="搜索用户名或邮箱" />

          <select id="userStatusFilter">
            <option value="all">全部状态</option>
            <option value="vip">VIP会员</option>
            <option value="normal">普通用户</option>
            <option value="active">正常账号</option>
            <option value="temporary_ban">临时封禁</option>
            <option value="permanent_ban">永久封禁</option>
            <option value="deleted">软删除</option>

          </select>
          <select id="userRoleFilter" aria-label="筛选管理角色">
            <option value="all">全部管理角色</option>
            <option value="member">普通用户</option>
            <option value="editor">新闻编辑</option>
            <option value="hr">HR</option>
            <option value="admin">管理员</option>
          </select>
        </div>
        <p id="usersPermissionInfo" aria-live="polite"></p>
        <p id="usersOwnerInfo"></p>

        <table class="admin-table" id="usersTable">
          <thead>
            <tr>
              <th>用户ID</th>
              <th>用户名</th>
              <th>邮箱</th>
              <th>会员状态</th>
              <th>钱包余额</th>
              <th>注册时间</th>
              <th>账号状态</th>
              <th>管理角色</th>
              <th>操作</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td colspan="9">正在读取真实用户...</td>
            </tr>
          </tbody>
        </table>
        <div style="display:flex;align-items:center;gap:12px;margin-top:16px;">
          <button class="small-btn" id="usersPrevPage" type="button" disabled>上一页</button>
          <span id="usersPageInfo" aria-live="polite">正在加载...</span>
          <button class="small-btn" id="usersNextPage" type="button" disabled>下一页</button>
        </div>
      </section>

      <div class="modal-overlay" id="userModal">
        <div class="modal-box">
          <div class="modal-header">
            <h2 id="userModalTitle">用户详情</h2>
            <button onclick="closeUserModal()">×</button>
          </div>

          <div class="modal-content" id="userModalContent"></div>
        </div>
      </div>

      <dialog id="userRoleDialog" aria-labelledby="userRoleTitle" style="width:min(430px,calc(100% - 32px));box-sizing:border-box;border:0;border-radius:12px;padding:24px;">
        <form id="userRoleForm">
          <h2 id="userRoleTitle">设置管理角色</h2>
          <p>当前角色：<strong id="userRoleCurrent"></strong></p>
          <label for="userRoleSelect">允许分配的角色</label>
          <select id="userRoleSelect" required style="display:block;width:100%;margin:8px 0 14px;"></select>
          <p>管理员、HR及超级管理员不能直接授予。高权限需独立审批；当前未开放此流程。公司职务不决定系统权限。</p>
          <label for="userRoleReason">操作原因（5至500字）</label>
          <textarea id="userRoleReason" required minlength="5" maxlength="500" rows="3" style="display:block;width:100%;box-sizing:border-box;margin:8px 0 16px;"></textarea>
          <button id="userRoleSubmit" type="submit" class="small-btn">确认设置</button>
          <button id="userRoleCancel" type="button" class="table-btn">取消</button>
        </form>
      </dialog>

    </main>

  </div>

  <script src="admin-menu.js"></script>
  <script src="admin.js"></script>
  <script src="admin-users-live.js?v=roles-20261023"></script>
</body>

</html>
