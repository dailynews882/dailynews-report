<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>评论管理 - Daily News</title>
  <link rel="stylesheet" href="admin.css" />
</head>

<body>

  <div class="admin-layout">

    <aside class="admin-sidebar" id="adminSidebar"></aside>

    <div class="modal-overlay" id="commentModal">
      <div class="modal-box">
        <div class="modal-header">
          <h2>评论详情</h2>
          <button onclick="closeCommentModal()">×</button>
        </div>

        <div class="modal-content" id="commentModalContent"></div>
      </div>
    </div>
    <main class="admin-main">
      <header class="admin-header">
        <h1>评论管理</h1>
        <span>管理用户评论、审核内容和处理违规评论</span>
      </header>

      <section class="dashboard-cards">
        <div class="dashboard-card">
          <h3>评论总数</h3>
          <p>326</p>
        </div>

        <div class="dashboard-card">
          <h3>今日新增</h3>
          <p>24</p>
        </div>

        <div class="dashboard-card">
          <h3>待审核</h3>
          <p>8</p>
        </div>

        <div class="dashboard-card">
          <h3>违规评论</h3>
          <p>3</p>
        </div>
      </section>

      <section class="admin-panel">
        <div class="panel-title-row">
          <h2>评论列表</h2>
          <button class="small-btn">导出评论</button>
        </div>
        <div class="table-tools">
          <input type="text" id="commentSearchInput" placeholder="搜索用户、新闻标题或评论内容" onkeyup="filterComments()" />

          <select id="commentStatusFilter" onchange="filterComments()">
            <option value="all">全部状态</option>
            <option value="approved">已通过</option>
            <option value="pending">待审核</option>
            <option value="violation">疑似违规</option>
          </select>
        </div>

        <table class="admin-table" id="commentsTable">
          <thead>
            <tr>
              <th>评论ID</th>
              <th>用户</th>
              <th>新闻标题</th>
              <th>评论内容</th>
              <th>状态</th>
              <th>评论时间</th>
              <th>操作</th>
            </tr>
          </thead>

          <tbody id="commentsTableBody"></tbody>
          </tbody>
        </table>
      </section>

    </main>

  </div>

  <script src="admin-menu.js"></script>
  <script src="admin.js"></script>
  <script src="admin-comments.js"></script>
</body>

</html>
