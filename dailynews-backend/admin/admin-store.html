<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>商城管理 - Daily News</title>
    <link rel="stylesheet" href="admin.css" />
</head>

<body>
    <div class="admin-layout">
        <aside class="admin-sidebar" id="adminSidebar"></aside>

        <main class="admin-main">
            <header class="admin-header">
                <h1>商城管理</h1>
                <span>管理电子书、报告、视频和会员商品</span>
            </header>

            <section class="admin-panel">
                <div class="panel-title-row">
                    <div>
                        <h2>商品列表</h2>
                        <p>
                            后台新增或编辑商品后，前台商城自动同步。
                        </p>
                    </div>

                    <button type="button" class="small-btn" id="addStoreProductButton">
                        新增商品
                    </button>
                </div>

                <p id="storeAdminMessage" class="store-admin-message" aria-live="polite"></p>

                <div class="store-admin-table-wrap">
                    <table class="admin-table store-admin-table">
                        <thead>
                            <tr>
                                <th>排序</th>
                                <th>商品代码</th>
                                <th>商品名称</th>
                                <th>类型</th>
                                <th>价格</th>
                                <th>状态</th>
                                <th>推荐</th>
                                <th>操作</th>
                            </tr>
                        </thead>

                        <tbody id="storeProductsTableBody">
                            <tr>
                                <td colspan="8">正在读取商品...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div class="modal-overlay" id="storeProductModal" hidden>
        <div class="modal-box store-product-modal-box">
            <div class="modal-header">
                <h2 id="storeProductModalTitle">
                    新增商品
                </h2>

                <button type="button" id="closeStoreProductModalButton">
                    ×
                </button>
            </div>

            <div class="modal-content">
                <input type="hidden" id="storeProductId" />

                <div class="store-product-form-grid">
                    <div class="form-group">
                        <label for="storeProductCode">
                            商品代码
                        </label>

                        <input type="text" id="storeProductCode" placeholder="例如：ebook-ai-news" />
                    </div>

                    <div class="form-group">
                        <label for="storeProductName">
                            商品名称
                        </label>

                        <input type="text" id="storeProductName" placeholder="请输入商品名称" />
                    </div>

                    <div class="form-group">
                        <label for="storeProductType">
                            商品类型
                        </label>

                        <select id="storeProductType">
                            <option value="ebook">电子书</option>
                            <option value="report">研究报告</option>
                            <option value="video">视频内容</option>
                            <option value="membership">会员服务</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="storeProductPrice">
                            价格
                        </label>

                        <input type="number" id="storeProductPrice" min="0" step="0.01" value="0" />
                    </div>

                    <div class="form-group">
                        <label for="storeProductCurrency">
                            币种
                        </label>

                        <select id="storeProductCurrency">
                            <option value="SGD">SGD</option>
                            <option value="USD">USD</option>
                            <option value="CNY">CNY</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="storeProductStatus">
                            商品状态
                        </label>

                        <select id="storeProductStatus">
                            <option value="draft">草稿</option>
                            <option value="published">已上架</option>
                            <option value="unpublished">已下架</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="storeProductSortOrder">
                            排序
                        </label>

                        <input type="number" id="storeProductSortOrder" value="0" />
                    </div>

                    <div class="form-group store-product-checkbox-group">
                        <label>
                            <input type="checkbox" id="storeProductFeatured" />
                            推荐商品
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="storeProductAccessUrl">
                        购买后访问地址
                    </label>

                    <input type="text" id="storeProductAccessUrl" placeholder="/subscribe.html 或数字内容地址" />
                </div>

                <div class="form-group">
                    <label>商品简介与详情文字</label>

                    <div class="store-editor-toolbar">
                        <button type="button" data-store-command="bold">
                            加粗
                        </button>

                        <button type="button" data-store-command="italic">
                            斜体
                        </button>

                        <button type="button" data-store-command="underline">
                            下划线
                        </button>

                        <button type="button" data-store-command="formatBlock" data-store-value="h2">
                            大标题
                        </button>

                        <button type="button" data-store-command="formatBlock" data-store-value="h3">
                            小标题
                        </button>

                        <button type="button" data-store-command="fontSize" data-store-value="5">
                            大字号
                        </button>

                        <button type="button" data-store-command="insertUnorderedList">
                            项目列表
                        </button>

                        <button type="button" data-store-command="insertOrderedList">
                            编号列表
                        </button>

                        <button type="button" id="insertStoreDescriptionLinkButton">
                            插入链接
                        </button>

                        <button type="button" data-store-command="removeFormat">
                            清除格式
                        </button>
                    </div>

                    <div id="storeProductDescription" class="store-product-description-editor" contenteditable="true"
                        data-placeholder="请输入商品简介和详情文字……"></div>
                </div>

                <section class="store-image-management">
                    <div class="store-image-section">
                        <div class="store-image-section-header">
                            <div>
                                <h3>商品封面图</h3>
                                <p>
                                    最多4张；第一张作为商城列表主图。
                                </p>
                            </div>

                            <label class="small-btn store-image-upload-label" for="storeCoverImagesInput">
                                选择封面图
                            </label>
                        </div>

                        <input type="file" id="storeCoverImagesInput"
                            accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp" multiple hidden />

                        <div id="storeCoverImagesPreview" class="store-image-preview-grid"></div>
                    </div>

                    <div class="store-image-section">
                        <div class="store-image-section-header">
                            <div>
                                <h3>商品详情图</h3>
                                <p>
                                    最多10张；显示在商品详情页正文下方。
                                </p>
                            </div>

                            <label class="small-btn store-image-upload-label" for="storeDetailImagesInput">
                                选择详情图
                            </label>
                        </div>

                        <input type="file" id="storeDetailImagesInput"
                            accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp" multiple hidden />

                        <div id="storeDetailImagesPreview" class="store-image-preview-grid"></div>
                    </div>
                </section>

                <p class="store-image-save-note">
                    新增商品时请先填写基本信息并点击“保存商品”。
                    商品创建成功后，系统会继续上传刚才选择的图片。
                </p>

                <button type="button" class="small-btn full-btn" id="saveStoreProductButton">
                    保存商品
                </button>
            </div>
        </div>
    </div>

    <script src="admin-menu.js"></script>
    <script src="admin-store.js"></script>
</body>

</html>
