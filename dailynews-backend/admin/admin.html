<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>后台管理首页 - Daily News</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <div class="admin-layout">

    <!-- 左侧菜单 -->
    <aside class="admin-sidebar">
      <h2>Daily News</h2>
      <p>后台管理系统</p>

      <nav>
        <a href="admin.html" class="active">后台首页</a>
        <a href="admin-users.html">用户管理</a>
        <a href="admin-wallet.html">钱包管理</a>
        <a href="admin-subscriptions.html">订阅管理</a>
        <a href="admin-withdrawals.html">提现管理</a>
        <a href="admin-api.html">API管理</a>
      </nav>

      <button class="logout-btn" onclick="adminLogout()">退出登录</button>
    </aside>

    <!-- 右侧内容 -->
    <main class="admin-main">
      <header class="admin-header">
        <h1>后台首页</h1>
        <span>欢迎回来，管理员</span>
      </header>

      <section class="dashboard-cards">
        <div class="dashboard-card">
          <h3>总用户数</h3>
          <p>128</p>
        </div>

        <div class="dashboard-card">
          <h3>VIP会员</h3>
          <p>36</p>
        </div>

        <div class="dashboard-card">
          <h3>充值金额</h3>
          <p>$2,580</p>
        </div>

        <div class="dashboard-card">
          <h3>提现申请</h3>
          <p>5</p>
        </div>
      </section>

      <section class="admin-panel">
        <h2>系统概览</h2>
        <p>这里是 Daily News 网站后台管理中心。你可以管理用户、钱包、订阅会员和提现申请。</p>
      </section>
    </main>

  </div>

  <script src="admin.js"></script>
</body>
</html>
