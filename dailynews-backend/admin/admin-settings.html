<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>系统设置 - Daily News</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <div class="admin-layout">

    <aside class="admin-sidebar" id="adminSidebar"></aside>

    <main class="admin-main">
      <header class="admin-header">
        <h1>系统设置</h1>
        <span>管理网站基础参数、会员价格、功能开关</span>
      </header>

      <section class="admin-panel">
        <div class="panel-title-row">
          <h2>网站基础设置</h2>
          <button class="small-btn" onclick="saveSettings()">保存设置</button>
        </div>

        <div class="settings-form">

          <div class="form-group">
            <label>网站名称</label>
            <input type="text" value="Daily News" />
          </div>

          <div class="form-group">
            <label>网站副标题</label>
            <input type="text" value="AI聚合新闻分析平台" />
          </div>

          <div class="form-group">
            <label>月度VIP价格</label>
            <input type="text" value="$9.90" />
          </div>

          <div class="form-group">
            <label>年度VIP价格</label>
            <input type="text" value="$99.00" />
          </div>

          <div class="form-group">
            <label>免费用户每日阅读次数</label>
            <input type="number" value="10" />
          </div>

          <div class="form-group">
            <label>VIP用户每日AI分析次数</label>
            <input type="number" value="100" />
          </div>

        </div>
      </section>

      <section class="admin-panel settings-panel">
        <h2>功能开关</h2>

        <div class="switch-row">
          <div>
            <h3>新闻API</h3>
            <p>开启后，网站可以自动获取新闻内容。</p>
          </div>
          <label class="switch">
            <input type="checkbox" checked />
            <span class="slider"></span>
          </label>
        </div>

        <div class="switch-row">
          <div>
            <h3>AI摘要分析</h3>
            <p>开启后，系统可以为新闻生成AI摘要。</p>
          </div>
          <label class="switch">
            <input type="checkbox" checked />
            <span class="slider"></span>
          </label>
        </div>

        <div class="switch-row">
          <div>
            <h3>Stripe支付</h3>
            <p>开启后，用户可以使用真实支付充值或订阅。</p>
          </div>
          <label class="switch">
            <input type="checkbox" />
            <span class="slider"></span>
          </label>
        </div>

        <div class="switch-row">
          <div>
            <h3>网站维护模式</h3>
            <p>开启后，普通用户暂时无法访问网站。</p>
          </div>
          <label class="switch">
            <input type="checkbox" />
            <span class="slider"></span>
          </label>
        </div>

      </section>

    </main>

  </div>

  <script src="admin-menu.js"></script>
  <script src="admin.js"></script>
</body>
</html>
