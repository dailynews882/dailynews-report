<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>会员登录 - Daily News</title>
  <style>
    body {
      background: #07111f;
      color: white;
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    .box {
      width: 380px;
      margin: auto;
      background: #101c2e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 120, 255, 0.3);
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #2b5f9e;
      background: #07111f;
      color: white;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      background: #0077ff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #005fd1;
    }

    #message {
      margin-top: 15px;
      color: #ffd700;
      line-height: 1.6;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Daily News 会员登录</h2>

    <input id="account" placeholder="会员名 / 邮箱 / 手机号码" />
    <input id="password" type="password" placeholder="请输入密码" />

    <button onclick="login()">登录</button>

    <div id="message"></div>
  </div>

  <script>
    const API_BASE = "http://localhost:5000/api/auth";

    function showMessage(text) {
      document.getElementById("message").innerText = text;
    }

    async function login() {
      const account = document.getElementById("account").value.trim();
      const password = document.getElementById("password").value;

      if (!account || !password) {
        showMessage("请输入账号和密码");
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/login`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            account,
            password
          })
        });

        const data = await res.json();

        if (data.success) {
          localStorage.setItem("dailynews_token", data.token);
          localStorage.setItem("dailynews_user", JSON.stringify(data.user));

          showMessage(
            "登录成功！欢迎你：" +
            data.user.username +
            "\n会员等级：" +
            data.user.memberLevel
          );

          setTimeout(() => {
          window.location.href = "my.html";
        }, 800);
          showMessage(data.message);
        }
      } catch (error) {
        showMessage("登录失败，请确认后端是否启动");
      }
    }
  </script>
</body>
</html>
