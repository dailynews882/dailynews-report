<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DailyNews - 新闻详情</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #020617;
      color: #e5e7eb;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    header {
      padding: 22px 48px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }

    header h1 {
      margin: 0;
      color: #38bdf8;
      font-size: 36px;
      font-weight: 800;
    }

    header p {
      margin: 8px 0 0;
      color: #94a3b8;
      font-size: 15px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    #detailMessage {
      color: #facc15;
      margin-bottom: 18px;
      font-size: 16px;
      font-weight: bold;
    }

    .detail-card {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 26px;
    }

    .detail-top {
      margin-bottom: 14px;
    }

    .detail-category {
      display: inline-block;
      padding: 5px 10px;
      background: #1d4ed8;
      color: white;
      border-radius: 6px;
      font-size: 13px;
    }

    .detail-vip {
      display: inline-block;
      padding: 5px 10px;
      background: #f97316;
      color: white;
      border-radius: 6px;
      font-size: 13px;
      margin-left: 8px;
    }

    .detail-title {
      margin: 0 0 14px;
      color: #f8fafc;
      font-size: 34px;
      line-height: 1.35;
    }

    .detail-meta {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 20px;
      border-bottom: 1px solid #334155;
      padding-bottom: 16px;
    }

    .detail-image {
      width: 100%;
      max-height: 460px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 20px;
      background: #1e293b;
    }

    .detail-image-placeholder {
      width: 100%;
      height: 260px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 20px;
    }

    .detail-summary {
      margin: 0 0 22px;
      padding: 16px;
      background: #020617;
      border-left: 4px solid #38bdf8;
      color: #cbd5e1;
      line-height: 1.7;
      border-radius: 8px;
      font-size: 16px;
    }

    .detail-content {
      color: #e5e7eb;
      font-size: 17px;
      line-height: 1.9;
    }

    .detail-content p {
      margin: 0 0 18px;
    }

    .detail-video-box {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #334155;
    }

    .detail-video-link {
      display: inline-block;
      padding: 10px 15px;
      background: #2563eb;
      color: white;
      border-radius: 7px;
      text-decoration: none;
    }

    .detail-actions {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #334155;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .detail-back {
      display: inline-block;
      padding: 10px 15px;
      background: #2563eb;
      color: white;
      border-radius: 7px;
      text-decoration: none;
      font-size: 14px;
    }

    .detail-back:hover {
      background: #1d4ed8;
    }

    @media (max-width: 720px) {
      header {
        padding: 20px 24px;
      }

      header h1 {
        font-size: 30px;
      }

      .container {
        padding: 24px 16px;
      }

      .detail-card {
        padding: 20px;
      }

      .detail-title {
        font-size: 26px;
      }

      .detail-content {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>DailyNews</h1>
    <p>新闻详情 · 全球新闻聚合 · AI 分析 · 会员深度阅读</p>
  </header>

  <main class="container">
    <div id="detailMessage">正在加载新闻详情...</div>
    <div id="newsDetailBox"></div>
  </main>

  <script src="./news-detail.js"></script>
</body>
</html>
