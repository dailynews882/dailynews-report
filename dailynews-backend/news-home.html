<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DailyNews - 新闻首页</title>

  <style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #020617;
    color: #e5e7eb;
    font-family: Arial, "Microsoft YaHei", sans-serif;
  }

  header {
    padding: 20px 48px;
    background: #0f172a;
    border-bottom: 1px solid #334155;
  }

  header h1 {
    margin: 0;
    color: #38bdf8;
    font-size: 38px;
    font-weight: 800;
  }

  header p {
    margin: 6px 0 0;
    color: #94a3b8;
    font-size: 16px;
  }

  .container {
    max-width: 1180px;
    margin: 0 auto;
    padding: 26px 24px;
  }

  #newsMessage {
    color: #facc15;
    margin-bottom: 14px;
    font-size: 15px;
    font-weight: bold;
  }

  .news-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .news-card {
    display: flex;
    width: 100%;
    height: 145px;
    background: #111827;
    border: 1px solid #334155;
    border-radius: 10px;
    overflow: hidden;
    transition: 0.2s;
  }

  .news-card:hover {
    border-color: #38bdf8;
    background: #162033;
  }

  .news-image,
  .news-placeholder {
    width: 180px;
    min-width: 180px;
    height: 145px;
    object-fit: cover;
    background: #1e293b;
  }

  .news-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #64748b;
    font-size: 16px;
    background: linear-gradient(135deg, #1e293b, #0f172a);
  }

  .news-content {
    flex: 1;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
  }

  .tag-row {
    height: 22px;
    margin-bottom: 6px;
    flex-shrink: 0;
  }

  .news-category,
  .vip-tag {
    display: inline-block;
    padding: 3px 8px;
    color: white;
    border-radius: 5px;
    font-size: 11px;
    line-height: 1.2;
    vertical-align: middle;
  }

  .news-category {
    background: #1d4ed8;
  }

  .vip-tag {
    background: #f97316;
    margin-left: 5px;
  }

  .news-title {
    margin: 0 0 6px;
    color: #f8fafc;
    font-size: 20px;
    line-height: 1.35;
    font-weight: 700;

    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .news-summary {
    margin: 0 0 8px;
    color: #cbd5e1;
    font-size: 14px;
    line-height: 1.5;

    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .bottom-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    margin-top: auto;
    flex-shrink: 0;
  }

  .news-meta {
    color: #94a3b8;
    font-size: 12px;
    line-height: 1.5;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .read-more {
    display: inline-block;
    padding: 7px 13px;
    background: #2563eb;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-size: 13px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .read-more:hover {
    background: #1d4ed8;
  }

  @media (max-width: 760px) {
    header {
      padding: 18px 22px;
    }

    header h1 {
      font-size: 32px;
    }

    .container {
      padding: 20px 14px;
    }

    .news-card {
      height: auto;
      min-height: 150px;
    }

    .news-image,
    .news-placeholder {
      width: 120px;
      min-width: 120px;
      height: auto;
      min-height: 150px;
    }

    .news-title {
      font-size: 16px;
    }

    .news-summary {
      font-size: 13px;
      -webkit-line-clamp: 2;
    }

    .bottom-row {
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    .news-meta {
      white-space: normal;
      font-size: 11px;
    }
  }
</style>
</head>

<body>
  <header>
    <h1>DailyNews</h1>
    <p>全球新闻聚合 · AI 分析 · 会员深度阅读</p>
  </header>

  <main class="container">
    <div id="newsMessage">正在加载新闻...</div>
    <div id="newsList" class="news-grid"></div>
  </main>

  <script src="./news-home.js"></script>
</body>
</html>
