<!DOCTYPE html>

<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

<meta
 name="viewport"
 content="width=device-width, initial-scale=1.0"
/>

  <title>会员注册 - Daily News</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 30px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(
          circle at top,
          #12315b 0%,
          #07111f 45%,
          #040a12 100%
        );
      color: #ffffff;
      font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;
    }

    .box {
      width: 100%;
      max-width: 460px;
      padding: 32px;
      background: rgba(16, 28, 46, 0.96);
      border: 1px solid rgba(72, 145, 255, 0.35);
      border-radius: 14px;
      box-shadow: 0 0 30px rgba(0, 120, 255, 0.22);
    }

    .logo {
      margin-bottom: 8px;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
    }

    .subtitle {
      margin: 0 0 25px;
      text-align: center;
      color: #9fb5d2;
      font-size: 14px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      color: #c9d8eb;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #2b5f9e;
      border-radius: 7px;
      outline: none;
      background: #07111f;
      color: #ffffff;
      font-size: 15px;
    }

    input:focus {
      border-color: #3d9bff;
      box-shadow: 0 0 0 3px rgba(61, 155, 255, 0.16);
    }

    input::placeholder {
      color: #6f829d;
    }

    .code-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    .code-row input {
      flex: 1;
    }

    .send-code-button {
      width: 140px;
      margin-top: 10px;
      padding: 12px 8px;
      flex-shrink: 0;
      border: none;
      border-radius: 7px;
      background: #1767c7;
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
    }

    .send-code-button:hover:not(:disabled) {
      background: #0d53a8;
    }

    .register-button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: none;
      border-radius: 7px;
      background: #0077ff;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .register-button:hover:not(:disabled) {
      background: #005fd1;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .hint {
      margin-top: 6px;
      color: #7f96b5;
      font-size: 12px;
      line-height: 1.5;
    }

    #message {
      min-height: 24px;
      margin-top: 16px;
      border-radius: 6px;
      text-align: center;
      line-height: 1.6;
      font-size: 14px;
      word-break: break-word;
    }

    #message.success {
      padding: 10px;
      background: rgba(25, 180, 90, 0.13);
      color: #72e69e;
    }

    #message.error {
      padding: 10px;
      background: rgba(235, 75, 75, 0.13);
      color: #ff9292;
    }

    .links {
      margin-top: 22px;
      text-align: center;
      color: #9fb5d2;
      font-size: 14px;
      line-height: 1.8;
    }

    .links a {
      color: #55aaff;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .divider {
      margin: 0 8px;
      color: #50647f;
    }

    @media (max-width: 480px) {
      .box {
        padding: 24px 20px;
      }

      .code-row {
        display: block;
      }

      .send-code-button {
        width: 100%;
      }
    }
  </style>

</head>

<body>
  <div class="box">
    <div class="logo">Daily News</div>

<p class="subtitle">
  使用邮箱验证码创建会员账户
</p>

<form id="registerForm">
  <label for="username">
    会员名
  </label>

  <input
    id="username"
    name="username"
    type="text"
    autocomplete="username"
    placeholder="4-20位字母和数字"
    minlength="4"
    maxlength="20"
    required
  />

  <div class="hint">
    会员名只能使用英文字母和数字。
  </div>

  <label for="email">
    邮箱地址
  </label>

  <input
    id="email"
    name="email"
    type="email"
    autocomplete="email"
    placeholder="请输入真实邮箱地址"
    maxlength="120"
    required
  />

  <label for="code">
    邮箱验证码
  </label>

  <div class="code-row">
    <input
      id="code"
      name="code"
      type="text"
      inputmode="numeric"
      autocomplete="one-time-code"
      placeholder="输入6位验证码"
      maxlength="6"
      required
    />

    <button
      id="sendCodeButton"
      class="send-code-button"
      type="button"
    >
      发送验证码
    </button>
  </div>

  <div class="hint">
    验证码有效期为5分钟，请检查收件箱和垃圾邮件。
  </div>

  <label for="password">
    设置密码
  </label>

  <input
    id="password"
    name="password"
    type="password"
    autocomplete="new-password"
    placeholder="8-32位，必须包含字母和数字"
    minlength="8"
    maxlength="32"
    required
  />

  <label for="confirmPassword">
    确认密码
  </label>

  <input
    id="confirmPassword"
    name="confirmPassword"
    type="password"
    autocomplete="new-password"
    placeholder="请再次输入密码"
    minlength="8"
    maxlength="32"
    required
  />

  <button
    id="registerButton"
    class="register-button"
    type="submit"
  >
    注册
  </button>
</form>

<div
  id="message"
  role="status"
  aria-live="polite"
></div>

<div class="links">
  已经有账号？
  <a href="login.html">
    立即登录
  </a>

  <span class="divider">|</span>

  <a href="index.html">
    返回首页
  </a>
</div>

  </div>

  <script>
    const isLiveServer =
      window.location.hostname === "127.0.0.1" ||
      (
        window.location.hostname === "localhost" &&
        window.location.port !== "5000"
      );

    const API_BASE = isLiveServer
      ? "http://localhost:5000/api/auth"
      : "/api/auth";

    const registerForm =
      document.getElementById("registerForm");

    const registerButton =
      document.getElementById("registerButton");

    const sendCodeButton =
      document.getElementById("sendCodeButton");

    const messageElement =
      document.getElementById("message");

    let countdownTimer = null;
    let remainingSeconds = 0;

    function showMessage(text, type = "") {
      messageElement.textContent = text;
      messageElement.className = type;
    }

    function setRegisterLoading(isLoading) {
      registerButton.disabled = isLoading;

      registerButton.textContent = isLoading
        ? "正在注册..."
        : "注册";
    }

    function startCountdown(seconds) {
      remainingSeconds = seconds;
      sendCodeButton.disabled = true;

      clearInterval(countdownTimer);

      function updateCountdown() {
        if (remainingSeconds <= 0) {
          clearInterval(countdownTimer);
          sendCodeButton.disabled = false;
          sendCodeButton.textContent = "重新发送";
          return;
        }

        sendCodeButton.textContent =
          remainingSeconds + "秒后重发";

        remainingSeconds -= 1;
      }

      updateCountdown();

      countdownTimer = setInterval(
        updateCountdown,
        1000
      );
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    async function sendEmailCode() {
      const email = document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();

      if (!email) {
        showMessage(
          "请先输入邮箱地址",
          "error"
        );
        return;
      }

      if (!isValidEmail(email)) {
        showMessage(
          "请输入正确的邮箱地址",
          "error"
        );
        return;
      }

      sendCodeButton.disabled = true;
      sendCodeButton.textContent = "正在发送...";
      showMessage("");

      try {
        const response = await fetch(
          API_BASE + "/email/send-code",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              account: email
            })
          }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
          showMessage(
            data.message || "验证码发送失败",
            "error"
          );

          sendCodeButton.disabled = false;
          sendCodeButton.textContent = "发送验证码";
          return;
        }

        showMessage(
          data.message || "验证码已发送，请检查邮箱",
          "success"
        );

        startCountdown(60);
      } catch (error) {
        console.error(
          "Send code request error:",
          error
        );

        showMessage(
          "无法连接服务器，请确认后端已经启动",
          "error"
        );

        sendCodeButton.disabled = false;
        sendCodeButton.textContent = "发送验证码";
      }
    }

    async function register() {
      const username = document
        .getElementById("username")
        .value
        .trim();

      const email = document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();

      const code = document
        .getElementById("code")
        .value
        .trim();

      const password = document
        .getElementById("password")
        .value;

      const confirmPassword = document
        .getElementById("confirmPassword")
        .value;

      if (
        !username ||
        !email ||
        !code ||
        !password ||
        !confirmPassword
      ) {
        showMessage(
          "请完整填写注册信息",
          "error"
        );
        return;
      }

      if (!/^[A-Za-z0-9]{4,20}$/.test(username)) {
        showMessage(
          "会员名必须为4-20位英文字母和数字",
          "error"
        );
        return;
      }

      if (!isValidEmail(email)) {
        showMessage(
          "请输入正确的邮箱地址",
          "error"
        );
        return;
      }

      if (!/^\d{6}$/.test(code)) {
        showMessage(
          "请输入正确的6位数字验证码",
          "error"
        );
        return;
      }

      if (password.length < 8 || password.length > 32) {
        showMessage(
          "密码长度必须为8-32位",
          "error"
        );
        return;
      }

      if (!/[A-Za-z]/.test(password)) {
        showMessage(
          "密码必须包含英文字母",
          "error"
        );
        return;
      }

      if (!/\d/.test(password)) {
        showMessage(
          "密码必须包含数字",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage(
          "两次输入的密码不一致",
          "error"
        );
        return;
      }

      setRegisterLoading(true);
      showMessage("");

      try {
        const response = await fetch(
          API_BASE + "/email/register",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              username,
              email,
              password,
              code
            })
          }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
          showMessage(
            data.message || "注册失败",
            "error"
          );
          return;
        }

        if (data.token) {
          localStorage.setItem(
            "dailynews_token",
            data.token
          );
        }

        if (data.user) {
          localStorage.setItem(
            "dailynews_user",
            JSON.stringify(data.user)
          );
        }

        showMessage(
          "注册成功！正在进入会员中心……",
          "success"
        );

        window.setTimeout(() => {
          window.location.href = "my.html";
        }, 1000);
      } catch (error) {
        console.error(
          "Register request error:",
          error
        );

        showMessage(
          "无法连接服务器，请确认后端已经启动",
          "error"
        );
      } finally {
        setRegisterLoading(false);
      }
    }

    sendCodeButton.addEventListener(
      "click",
      sendEmailCode
    );

    registerForm.addEventListener(
      "submit",
      function (event) {
        event.preventDefault();
        register();
      }
    );
  </script>

</body>
</html>
